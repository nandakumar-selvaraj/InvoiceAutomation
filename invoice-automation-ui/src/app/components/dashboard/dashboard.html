<!-- Main Dashboard Container -->
<main class="container my-5">
  <!-- Hero Section -->
  <section class="mb-4">
    <h1 class="h3 fw-bold text-dark mb-1">Invoice Automation</h1>
    <p class="text-secondary">Automate invoice data extraction with AI</p>
  </section>

  <div class="card border-0 bg-white shadow-sm rounded-4 p-4 mb-4">
    <!-- Visual Drag & Drop Zone -->
    <div
      class="upload-zone d-flex flex-column align-items-center justify-content-center border border-2 border-dashed rounded-3 py-5 px-3 bg-light text-center"
      [class.drag-over]="isDragging" (click)="fileInput.click()" (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">

      <div class="fs-1 mb-2 text-muted">📄</div>
      <h3 class="h5 fw-semibold text-dark mb-2">Upload your invoice</h3>
      <p class="text-muted small mb-0">
        Drag & drop your PDF here or <span
          class="text-primary fw-semibold decoration-underline cursor-pointer">Browse</span>
      </p>

      <input #fileInput type="file" class="d-none" accept="application/pdf" (change)="onFileSelected($event)">
    </div>

    <!-- Selected File Banner -->
    @if (selectedFile) {
    <div class="alert alert-info d-flex align-items-center justify-content-between mt-3 mb-0 rounded-3 border-0">
      <div class="d-flex align-items-center gap-2">
        <span>📎</span>
        <strong class="text-truncate" style="max-width: 250px;">{{ selectedFile.name }}</strong>
        <span class="badge bg-secondary-subtle text-secondary small">{{ (selectedFile.size / 1024 / 1024) |
          number:'1.2-2' }} MB</span>
      </div>
      <button type="button" class="btn-close small" aria-label="Clear file" (click)="clearFile($event)"></button>
    </div>
    }

    <!-- Actions Footer -->
    <div class="text-center mt-4">
      <button class="btn btn-primary px-5 py-2 fw-semibold shadow-sm" type="button" [disabled]="!selectedFile"
        (click)="extractInvoice()">
        Extract Invoice
      </button>
    </div>
  </div>

  @if (invoices()) {
  <!-- Reusable Extracted Invoice Table -->
  <app-invoice-table [invoices]="invoices()" (invoiceRemoved)="removeInvoice($event)" [showRemoveButton]=true>
  </app-invoice-table>

  <!-- Save Action Footer -->
  <div class="d-flex justify-content-end mt-3">
    <button type="button" class="btn btn-success px-4 py-2 fw-semibold shadow-sm d-flex align-items-center gap-2"
      title = "Extracted Invoice"
      [disabled]="selectedFile"
      (click)="saveInvoices()">
      💾 Save
    </button>
  </div>
  }
</main>
